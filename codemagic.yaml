workflows:
  ios-debug:
    name: SecureEdgeMobile iOS Debug

    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest
      cocoapods: default

      vars:
        XCODE_WORKSPACE: "ios/SecureEdgeMobile.xcworkspace"
        XCODE_SCHEME: "SecureEdgeMobile"
        NO_FLIPPER: "1"
        RCT_NEW_ARCH_ENABLED: "0"

    triggering:
      events:
        - push

      branch_patterns:
        - pattern: main
          include: true

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
        - $HOME/Library/Developer/Xcode/DerivedData

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Verify React Native setup
        script: |
          npx react-native info

      - name: Build iOS simulator app
        script: |
          xcodebuild \
            -workspace ios/SecureEdgeMobile.xcworkspace \
            -scheme SecureEdgeMobile \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | xcpretty

    artifacts:
      - ios/build/**/*.app

    publishing:
      email:
        recipients:
          - mannuruadhithya12@gmail.com
        notify:
          success: true
          failure: true
