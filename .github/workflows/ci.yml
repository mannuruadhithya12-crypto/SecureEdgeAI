name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Type Check, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --ci --coverage --watchAll=false

  android-build-check:
    name: Android Build Validation
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Validate Android Gradle files
        run: |
          cd android
          ./gradlew dependencies --configuration releaseRuntimeClasspath --dry-run
        continue-on-error: true

      - name: Check APK size (if release build exists)
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(stat -c%s "$APK_PATH")
            SIZE_MB=$(echo "scale=2; $SIZE/1048576" | bc)
            echo "APK size: ${SIZE_MB} MB"
            if (( $(echo "$SIZE_MB > 19" | bc -l) )); then
              echo "ERROR: APK size ${SIZE_MB} MB exceeds 19 MB budget!"
              exit 1
            else
              echo "APK size OK: ${SIZE_MB} MB < 19 MB"
            fi
          else
            echo "No release APK found, skipping size check"
          fi
        continue-on-error: true
